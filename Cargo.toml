[package]
name = "svg_stroke"
version = "0.1.0"
edition = "2021"
description = "Multi-layer outline (縁取り) effect for Premiere Pro / After Effects"

[lib]
crate-type = ["cdylib"]

[dependencies]
after-effects = "0.2"
premiere = "0.2"
rayon = "1"

[build-dependencies]
pipl = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
